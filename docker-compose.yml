services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: propackers
      POSTGRES_PASSWORD: propackers
      POSTGRES_DB: ProPackers
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U propackers -d ProPackers"]
      interval: 5s
      timeout: 5s
      retries: 10

  pgbouncer:
    image: edoburu/pgbouncer:1.22.1-p1
    environment:
      DATABASE_URL: postgres://propackers:propackers@postgres:5432/ProPackers
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 1000
      DEFAULT_POOL_SIZE: 20
      AUTH_TYPE: scram-sha-256
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "6432:5432"

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    expose:
      - "8000"
    environment:
      PORT: 8000
      NODE_ENV: production
      # App talks to Postgres through PgBouncer (transaction pooling).
      DATABASE_URL: postgres://propackers:propackers@pgbouncer:5432/ProPackers?pgbouncer=true&connection_limit=10&pool_timeout=20
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-change-me-generate-a-64-byte-hex-secret}
      OTP_PEPPER: ${OTP_PEPPER:-change-me-generate-a-random-secret}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      MAIL_TRANSPORT: ${MAIL_TRANSPORT:-}
    depends_on:
      pgbouncer:
        condition: service_started
      redis:
        condition: service_healthy
    # Scale horizontally: docker compose up --scale api=2

  lb:
    image: nginx:1.27-alpine
    ports:
      - "8000:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # The built frontend, served from the same origin as the API so the
      # refresh cookie can stay SameSite=Lax. Build it with:
      #   cd ../ProPackers-WMS-Frontend && npm run build
      # and point FRONTEND_DIST at the dist/ it produces.
      - ${FRONTEND_DIST:-../ProPackers-WMS-Frontend/dist}:/usr/share/nginx/html:ro
    depends_on:
      - api

  # Optional local S3 (MinIO). Set S3_* on the api service to use it.
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    profiles:
      - s3

volumes:
  pgdata:
  miniodata:
