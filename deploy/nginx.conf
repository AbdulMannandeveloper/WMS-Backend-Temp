upstream propackers_api {
    least_conn;
    server api:8000 max_fails=3 fail_timeout=10s;
}

server {
    listen 80;
    client_max_body_size 6m;

    # Health probes go straight through, ahead of everything else, so an
    # orchestrator never gets an SPA page when the API is down.
    location = /healthz {
        proxy_pass http://propackers_api/healthz;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location = /readyz {
        proxy_pass http://propackers_api/readyz;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # The API. Everything the browser calls lives under /api, which is what lets
    # the app be served from this same origin below.
    #
    # Same origin is not cosmetic: the refresh cookie can then be an ordinary
    # SameSite=Lax cookie instead of SameSite=None, which needs cross-site
    # cookies that browsers keep tightening. It also means no CORS preflight on
    # every request.
    location /api/ {
        proxy_pass http://propackers_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Express reads this for req.ip, but only because app.js sets
        # `trust proxy`. Without that the rate limiter sees this proxy as the
        # single client for all traffic.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Files the API still owns: the password-setup page and uploaded receipts.
    location /setup-password {
        proxy_pass http://propackers_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # The built frontend.
    root /usr/share/nginx/html;
    index index.html;

    # Hashed assets are immutable; index.html must not be cached or a deploy
    # leaves browsers loading an old bundle against a new API.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Client-side routes: /app/inventory is not a file, so hand back index.html
    # and let react-router resolve it. Without this a page refresh 404s.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
